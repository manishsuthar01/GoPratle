services:
  - type: web
    name: gopratle-api
    runtime: node
    plan: free
    buildCommand: pnpm install && pnpm build:api
    startCommand: pnpm start:api
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: LOG_LEVEL
        value: info
      - key: IDEMPOTENCY_TTL_SECONDS
        value: 86400
      - key: MONGODB_URI
        sync: false
      - key: CLIENT_ORIGIN
        sync: false
